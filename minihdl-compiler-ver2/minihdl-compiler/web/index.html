<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniHDL Playground</title>
<style>
:root{--bg:#e6ecf1;--panel:#f6f9fb;--ink:#15243b;--mute:#5b6b80;--rule:#c3cedb;--hi:#08796c;--lo:#8c99ab;--err:#b83a22;--warn:#9a6a00;--acc:#2b5aa0;--accfg:#fff;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#0c1829;--panel:#12233b;--ink:#dce8f6;--mute:#8da2bd;--rule:#25405f;--hi:#5eddc9;--lo:#4d6384;--err:#ff7b63;--warn:#f0c15a;--acc:#7fb2ee;--accfg:#0c1829}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 "Iowan Old Style",Palatino,Georgia,serif;display:flex;flex-direction:column}
code,pre,textarea,.mono{font-family:"Cascadia Code",Consolas,Menlo,monospace;font-size:13px}
header{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;padding:10px 18px;border-bottom:1px solid var(--rule);background:var(--panel)}
h1{font-size:20px;margin:0 8px 0 0;font-weight:700;letter-spacing:.2px}
h1 small{font-weight:400;color:var(--mute);font-size:14px;margin-left:6px}
label{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:13px}
select,button,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--rule);border-radius:4px}
select{padding:4px 6px;font-size:13px;font-family:inherit}
button{padding:5px 12px;cursor:pointer}
button.go{background:var(--acc);color:var(--accfg);border-color:var(--acc);font-weight:700;padding:6px 18px;margin-left:auto}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(300px,5fr) 7fr;gap:0}
section{min-height:0;display:flex;flex-direction:column}
#left{border-right:1px solid var(--rule)}
textarea{flex:1;min-height:220px;resize:none;border:0;border-radius:0;padding:14px 16px;background:var(--panel);line-height:1.55;tab-size:4;white-space:pre}
#diag{max-height:34%;overflow:auto;border-top:1px solid var(--rule);background:var(--bg)}
.d{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--rule);border-radius:0;background:none;padding:7px 16px;font-size:13px}
.d b{font-family:"Cascadia Code",Consolas,monospace;font-size:12px;margin-right:8px}
.d.error b{color:var(--err)}.d.warning b{color:var(--warn)}
.d i{display:block;color:var(--mute);font-style:normal;margin-left:2px}
.ok{padding:9px 16px;color:var(--hi);font-size:13px}
#strip{display:flex;flex-wrap:wrap;gap:6px 26px;padding:10px 18px;border-bottom:1px solid var(--rule);background:var(--panel)}
#strip div{min-width:84px}#strip b{display:block;font-size:19px;line-height:1.2;font-weight:700}
#strip span{color:var(--mute);font-size:12px}
#tabs{display:flex;flex-wrap:wrap;gap:2px;padding:8px 14px 0;border-bottom:1px solid var(--rule)}
#tabs button{border:1px solid transparent;border-bottom:0;border-radius:4px 4px 0 0;background:none;color:var(--mute);padding:5px 11px;font-size:13px}
#tabs button[aria-selected=true]{background:var(--panel);color:var(--ink);border-color:var(--rule);font-weight:700;position:relative;top:1px}
#panel{flex:1;min-height:0;overflow:auto;background:var(--panel)}
pre{margin:0;padding:16px 18px;white-space:pre;color:var(--ink)}
.empty{padding:28px 20px;color:var(--mute);max-width:46ch}
#ctl{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--rule)}
#ctl .mono{margin-left:auto;color:var(--ink)}
#hint{color:var(--mute);font-size:12px;padding:6px 16px 0}
svg{display:block;margin:8px 12px 20px}
.node{cursor:default}.in{cursor:pointer}
.node rect{fill:var(--bg);stroke:var(--lo);stroke-width:1.2}
.node.on rect{stroke:var(--hi);stroke-width:2}
.node text{fill:var(--ink);font:600 11px "Cascadia Code",Consolas,monospace;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.in.on rect{fill:var(--hi)}.in.on text{fill:var(--bg)}
.wire{fill:none;stroke:var(--lo);stroke-width:1}.wire.on{stroke:var(--hi);stroke-width:1.8}
@media(max-width:860px){main{grid-template-columns:1fr;overflow:auto}#left{border-right:0;min-height:60vh}#right{min-height:80vh}button.go{margin-left:0}}
@media(prefers-reduced-motion:no-preference){.wire,.node rect{transition:stroke .12s}}
</style>
</head>
<body>
<header>
  <h1>MiniHDL<small>playground</small></h1>
  <label>Example <select id="ex"></select></label>
  <label>Top module <select id="top"></select></label>
  <label>Optimization <select id="ol"><option value="2">-O2</option><option value="1">-O1</option><option value="0">-O0</option></select></label>
  <button class="go" id="go" title="Ctrl+Enter">Compile</button>
</header>
<main>
  <section id="left">
    <textarea id="src" spellcheck="false" aria-label="MiniHDL source"></textarea>
    <div id="diag" aria-live="polite"></div>
  </section>
  <section id="right">
    <div id="strip"></div>
    <div id="tabs" role="tablist"></div>
    <div id="panel" role="tabpanel"></div>
  </section>
</main>
<script>
const $=s=>document.querySelector(s);
const ORDER=["Circuit","Optimizer","Boolean","Timing","Faults","Truth table","Verilog","C model","Netlist before","Netlist after","AST","Tokens"];
const OPS={AND:(a,b)=>a&b,OR:(a,b)=>a|b,XOR:(a,b)=>a^b,NAND:(a,b)=>1-(a&b),NOR:(a,b)=>1-(a|b),XNOR:(a,b)=>1-(a^b),NOT:a=>1-a,BUF:a=>a,MUX:(s,a,b)=>s?a:b};
let D=null,tab="Circuit",inV={},G=null,examples=[];
const esc=s=>String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

async function compile(keepTop){
  $("#go").disabled=true;
  try{
    const r=await fetch("/api/compile",{method:"POST",body:JSON.stringify({source:$("#src").value,top:keepTop?$("#top").value:"",olevel:+$("#ol").value})});
    D=await r.json();
  }catch(e){D={ok:false,diagnostics:[{severity:"error",phase:"client",message:"Cannot reach the server. Is server.py still running?",line:0,col:0}],modules:[],texts:{}}}
  $("#go").disabled=false;
  const mods=D.modules||[],sel=D.top||(keepTop?$("#top").value:mods[mods.length-1]);
  $("#top").innerHTML=mods.map(m=>`<option${m===sel?" selected":""}>${esc(m)}</option>`).join("");
  inV={};G=D.ok?layout(D.netlist):null;
  drawDiag();drawStrip();drawTabs();
}

function drawDiag(){
  const ds=D.diagnostics||[];
  if(!ds.length){$("#diag").innerHTML='<div class="ok">Compiled with no errors or warnings.</div>';return}
  $("#diag").innerHTML=ds.map((d,i)=>`<button class="d ${d.severity}" data-i="${i}"><b>${d.severity} ${d.line?d.line+":"+d.col:""}</b>${esc(d.message)}${d.hint?`<i>hint: ${esc(d.hint)}</i>`:""}</button>`).join("");
}
$("#diag").onclick=e=>{
  const b=e.target.closest(".d");if(!b)return;
  const d=D.diagnostics[b.dataset.i];if(!d.line)return;
  const lines=$("#src").value.split("\n");let off=0;
  for(let i=0;i<d.line-1;i++)off+=lines[i].length+1;
  off+=Math.max(0,d.col-1);
  const t=$("#src");t.focus();t.setSelectionRange(off,off+Math.max(1,d.length||1));
};

function drawStrip(){
  if(!D.ok){$("#strip").innerHTML='<div><b style="color:var(--err)">'+(D.diagnostics||[]).filter(d=>d.severity==="error").length+' error(s)</b><span>fix them to compile</span></div>';return}
  const b=D.before,a=D.after,eq=D.equivalence,c=D.coverage;
  const it=(v,l)=>`<div><b>${v}</b><span>${l}</span></div>`;
  $("#strip").innerHTML=it(`${b.gates} → ${a.gates}`,"gates before → after")+it(`${b.area_ge} → ${a.area_ge}`,"area (gate equivalents)")+it(`${b.depth} → ${a.depth}`,"critical path")
   +it(eq.ok?"PASS":"FAIL",`equivalence, ${eq.tested} vectors`)+it(c.percent+"%",`fault coverage, ${c.tests} tests`);
}

function drawTabs(){
  const have=["Circuit",...ORDER.slice(1).filter(k=>D.texts&&D.texts[k])];
  if(!have.includes(tab))tab="Circuit";
  $("#tabs").innerHTML=have.map(k=>`<button role="tab" aria-selected="${k===tab}" data-k="${k}">${k}</button>`).join("");
  drawPanel();
}
$("#tabs").onclick=e=>{const b=e.target.closest("button");if(b){tab=b.dataset.k;drawTabs()}};

function drawPanel(){
  const p=$("#panel");
  if(tab==="Circuit"){
    if(!D.ok){p.innerHTML='<div class="empty">There is no circuit yet. Select a message under the source to jump to the problem, fix it, then compile again.</div>';return}
    p.innerHTML=`<div id="ctl"><button data-a="z">All 0</button><button data-a="r">Random</button><button data-a="s">Step +1</button><span class="mono" id="rd"></span></div><div id="hint">Click any input box to flip it. Wires and gates turn teal when their signal is 1.</div><div id="svgbox"></div>`;
    drawCircuit();
  }else p.innerHTML=`<pre>${esc(D.texts[tab]||"")}</pre>`;
}

const COL=104,ROW=42,W=58;
function layout(nl){
  const N=[],by={};
  const ensure=n=>by[n]||(by[n]={t:"c",net:n,label:n===1?"1":"0",lvl:0,w:30,ins:[]},N.push(by[n]),by[n]);
  nl.inputs.forEach(p=>p.bits.forEach((n,i)=>{by[n]={t:"i",net:n,label:p.bits.length>1?`${p.name}[${i}]`:p.name,lvl:0,w:W+10,ins:[]};N.push(by[n])}));
  nl.gates.forEach(g=>{g.in.forEach(ensure);by[g.out]={t:"g",op:g.op,net:g.out,ins:g.in,w:W,lvl:1+Math.max(...g.in.map(n=>by[n].lvl))};N.push(by[g.out])});
  const L=Math.max(0,...N.map(n=>n.lvl))+1;
  nl.outputs.forEach(p=>p.bits.forEach((n,i)=>{ensure(n);N.push({t:"o",net:n,ins:[n],label:p.bits.length>1?`${p.name}[${i}]`:p.name,lvl:L,w:W+10})}));
  const row={};
  N.forEach(n=>{const r=row[n.lvl]||0;row[n.lvl]=r+1;n.x=14+n.lvl*COL;n.y=10+r*ROW;n.h=n.ins.length>2?36:22});
  return{N,by,w:14+(L+1)*COL+20,h:20+Math.max(...Object.values(row))*ROW};
}
function values(){
  const v={0:0,1:1};
  D.netlist.inputs.forEach(p=>p.bits.forEach(n=>v[n]=inV[n]|0));
  D.netlist.gates.forEach(g=>v[g.out]=OPS[g.op](...g.in.map(i=>v[i]|0)));
  return v;
}
function drawCircuit(){
  const v=values(),{N,by,w,h}=G;let wires="",nodes="";
  N.forEach(n=>n.ins.forEach((src,j)=>{
    const s=by[src],x1=s.x+s.w,y1=s.y+s.h/2,x2=n.x,y2=n.y+n.h*(j+1)/(n.ins.length+1),m=(x1+x2)/2;
    wires+=`<path class="wire${v[src]?" on":""}" d="M${x1} ${y1}C${m} ${y1} ${m} ${y2} ${x2} ${y2}"/>`}));
  N.forEach(n=>{
    const on=v[n.net]?" on":"",txt=n.t==="g"?n.op:n.t==="c"?n.label:`${n.label}=${v[n.net]|0}`;
    nodes+=`<g class="node ${n.t==="i"?"in":""}${on}"${n.t==="i"?` data-net="${n.net}" tabindex="0" role="button" aria-label="flip ${n.label}"`:""}><rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="${n.t==="g"?3:n.h/2}"/><text x="${n.x+n.w/2}" y="${n.y+n.h/2}">${txt}</text></g>`});
  $("#svgbox").innerHTML=`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="circuit schematic">${wires}${nodes}</svg>`;
  const rd=ports=>ports.map(p=>{let x=0;p.bits.forEach((n,i)=>x|=(v[n]|0)<<i);return`${p.name}=${x}`}).join(" ");
  $("#rd").textContent=`${rd(D.netlist.inputs)}  →  ${rd(D.netlist.outputs)}`;
}
const flip=e=>{const g=e.target.closest("[data-net]");if(g){inV[g.dataset.net]^=1;drawCircuit()}};
$("#panel").addEventListener("click",e=>{
  flip(e);const b=e.target.closest("[data-a]");if(!b)return;
  const bits=D.netlist.inputs.flatMap(p=>p.bits);
  if(b.dataset.a==="z")bits.forEach(n=>inV[n]=0);
  if(b.dataset.a==="r")bits.forEach(n=>inV[n]=Math.random()<.5?1:0);
  if(b.dataset.a==="s"){let c=1;bits.forEach(n=>{const t=(inV[n]|0)+c;inV[n]=t&1;c=t>>1})}
  drawCircuit();
});
$("#panel").addEventListener("keydown",e=>{if(e.key===" "||e.key==="Enter"){const g=e.target.closest("[data-net]");if(g){e.preventDefault();flip(e)}}});

$("#go").onclick=()=>compile(false);
$("#top").onchange=()=>compile(true);
$("#ol").onchange=()=>compile(true);
$("#ex").onchange=()=>{$("#src").value=examples[$("#ex").selectedIndex].source;compile(false)};
$("#src").addEventListener("keydown",e=>{
  if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){e.preventDefault();compile(true)}
  if(e.key==="Tab"){e.preventDefault();const t=e.target,s=t.selectionStart;t.value=t.value.slice(0,s)+"    "+t.value.slice(t.selectionEnd);t.selectionStart=t.selectionEnd=s+4}
});
(async()=>{
  examples=await (await fetch("/api/examples")).json();
  $("#ex").innerHTML=examples.map(x=>`<option>${esc(x.name)}</option>`).join("");
  const i=Math.max(0,examples.findIndex(x=>x.name==="adder.hdl"));
  $("#ex").selectedIndex=i;$("#src").value=examples[i].source;compile(false);
})();
</script>
</body>
</html>
